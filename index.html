:root{
  --bg:#06080e;--panel:rgba(255,255,255,.035);--panel2:rgba(255,255,255,.06);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);
  --text:#eef2f8;--mute:#8a94a8;--dim:#5b6478;--ice:#9fdcff;--good:#34d399;--cost:#ff6b6b;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Outfit",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:var(--text)}
/* ambient background */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx::before{content:"";position:absolute;inset:-20%;background:
  radial-gradient(40% 35% at 15% 10%,rgba(80,140,255,.16),transparent 70%),
  radial-gradient(35% 30% at 90% 15%,rgba(160,110,255,.12),transparent 70%),
  radial-gradient(45% 40% at 60% 110%,rgba(40,220,200,.10),transparent 70%);
  animation:drift 28s ease-in-out infinite alternate}
.bgfx::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(70% 60% at 50% 40%,#000 0%,transparent 75%);opacity:.35}
@keyframes drift{to{transform:translate3d(3%,-2%,0) scale(1.05)}}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr;padding:22px 28px 24px;gap:20px}
/* header */
header{display:flex;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#1c2a44,#0c1220);border:1px solid var(--line2);box-shadow:0 8px 30px rgba(80,160,255,.18),inset 0 1px 0 rgba(255,255,255,.08)}
.brand h1{font-family:"Bebas";font-weight:400;font-size:34px;letter-spacing:.06em;line-height:.9}
.brand h1 span{color:var(--ice)}
.brand p{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--mute);margin-top:4px}
.round{margin-left:auto;display:flex;align-items:center;gap:18px;padding:10px 18px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.round .lbl{font-size:11px;letter-spacing:.28em;color:var(--mute);text-transform:uppercase}
.round .num{font-family:"Bebas";font-size:34px;line-height:.9;letter-spacing:.04em}
.round .num small{font-size:20px;color:var(--dim)}
.pips{display:flex;gap:6px}
.pip{width:22px;height:6px;border-radius:4px;background:rgba(255,255,255,.1);transition:.4s}
.pip.done{background:var(--ice);box-shadow:0 0 12px rgba(159,220,255,.6)}
.pip.now{background:linear-gradient(90deg,var(--ice),rgba(159,220,255,.25));animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.turn{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(159,220,255,.14),rgba(159,220,255,.03));border:1px solid rgba(159,220,255,.3)}
.turn .lbl{font-size:11px;letter-spacing:.28em;color:var(--ice);text-transform:uppercase}
.turn .who{font-weight:700;font-size:18px}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);transition:.2s}
.iconbtn:hover{background:var(--panel2);border-color:var(--line2)}
.iconbtn svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* main */
main{display:grid;grid-template-columns:1fr 380px;gap:22px;min-height:0}
.board{display:flex;flex-direction:column;gap:14px;min-height:0}
#paidGrid{flex:1;grid-auto-rows:1fr;grid-template-columns:repeat(2,1fr)}#buffGrid{flex:.42;grid-auto-rows:1fr}
.sectionlbl{display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute)}
.sectionlbl::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.sectionlbl b{color:var(--text);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid.buff{grid-template-columns:repeat(3,1fr)}
.tier{--c:#fff;position:relative;text-align:left;border-radius:18px;padding:16px 18px 15px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 13%,transparent),rgba(255,255,255,.02) 55%);border:1px solid color-mix(in srgb,var(--c) 28%,transparent);overflow:hidden;transition:transform .18s ease,border-color .2s,box-shadow .25s;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:18px;row-gap:8px;align-items:center;align-content:center;isolation:isolate}
.tier::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(120% 80% at 0% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 60%);opacity:0;transition:.25s}
.tier::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;z-index:-1;background:linear-gradient(100deg,transparent,rgba(255,255,255,.08),transparent);transform:skewX(-18deg);transition:none}
.tier:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--c) 60%,transparent);box-shadow:0 14px 40px -12px color-mix(in srgb,var(--c) 55%,transparent)}
.tier:hover::before{opacity:1}
.tier:hover::after{left:130%;transition:left .7s ease}
.tier:active{transform:translateY(0) scale(.985)}
.tier:disabled{opacity:.32;filter:grayscale(.7);cursor:not-allowed;transform:none;box-shadow:none}
.tier .ic{grid-row:1/3;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,rgba(0,0,0,.3));border:1px solid color-mix(in srgb,var(--c) 35%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.tier .ic svg{width:24px;height:24px;stroke:var(--c);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 60%,transparent))}
.tier .nm{white-space:nowrap;font-family:"Bebas";font-size:30px;letter-spacing:.05em;line-height:.9;color:#fff;min-width:0}
.tier .nm small{font-family:"Outfit";font-size:11px;letter-spacing:.2em;color:var(--mute);margin-left:8px;vertical-align:4px}
.tier .ds{grid-column:2/3;font-size:13.5px;color:var(--mute);line-height:1.3}
.tier .cost{grid-row:1/3;grid-column:3;text-align:right}
.cost .big{font-family:"Bebas";font-size:30px;line-height:.9;letter-spacing:.03em}
.cost .big.neg{color:var(--cost)}.cost .big.pos{color:var(--good)}.cost .big.zero{color:var(--mute)}
.cost .per{font-size:11px;color:var(--mute);letter-spacing:.06em;margin-top:3px;white-space:nowrap}
.cost .left{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.cost .bst{font-size:10px;letter-spacing:.22em;color:var(--dim);text-transform:uppercase}
/* side */
aside{display:flex;flex-direction:column;gap:14px;min-height:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(14px)}
.ledger{padding:16px 18px}
.ledger h3,.log h3{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.ledger h3 b{color:var(--text);font-weight:700;letter-spacing:.08em}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px}
.st{border-radius:12px;padding:8px 4px;text-align:center;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.st .k{font-size:10px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.st .v{font-family:"Bebas";font-size:24px;line-height:1;margin-top:3px}
.v.neg{color:var(--cost)}.v.pos{color:var(--good)}.v.zero{color:var(--dim)}
.net{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.net span{font-size:12px;letter-spacing:.24em;color:var(--mute);text-transform:uppercase}
.net b{font-family:"Bebas";font-size:30px;letter-spacing:.03em}
.log{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 10px 10px 18px}
.log .scroll{overflow:auto;flex:1;margin-top:10px;padding-right:8px}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ptab{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mute);transition:.2s}
.ptab.on{background:rgba(159,220,255,.14);border-color:rgba(159,220,255,.4);color:#fff}
.entry{--c:#fff;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 10px;border-radius:14px;margin-bottom:6px;background:rgba(0,0,0,.2);border:1px solid var(--line);border-left:3px solid var(--c);animation:slidein .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slidein{from{opacity:0;transform:translateX(18px)}}
.entry .r{font-family:"Bebas";font-size:22px;color:var(--dim);text-align:center}
.entry .a{font-weight:700;font-size:15px;line-height:1.15}
.entry .t{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--c);margin-top:2px}
.entry .d{font-family:"Bebas";font-size:20px}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:30px 10px;line-height:1.6}
.slot{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:10px;border-radius:14px;margin-bottom:6px;border:1px dashed var(--line);color:var(--dim);font-size:13px}
.slot .r{font-family:"Bebas";font-size:22px;text-align:center}
/* overlay */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(3,5,10,.72);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.on{opacity:1;pointer-events:auto}
.stage{--c:#fff;width:min(880px,86vw);text-align:center;position:relative}
.stage .halo{position:absolute;left:50%;top:44%;width:900px;height:900px;transform:translate(-50%,-50%);background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,transparent),transparent 60%);pointer-events:none;opacity:.8;animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.08);opacity:.55}}
.rays{position:absolute;left:50%;top:44%;width:1200px;height:1200px;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--c) 10%,transparent) 0 6deg,transparent 6deg 18deg);mask-image:radial-gradient(circle,#000 0%,transparent 55%);opacity:0;animation:spin 40s linear infinite;pointer-events:none;transition:opacity .6s}
.revealed .rays{opacity:1}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.stage .pill{display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 10%,transparent);position:relative}
.stage .whoroll{position:relative;font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);margin-bottom:14px}
.reel{position:relative;height:150px;margin:26px 0 8px;overflow:hidden;mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.reel .nm{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-family:"Bebas";font-size:104px;letter-spacing:.03em;line-height:1;white-space:nowrap;color:#fff}
.reel .nm.tick{animation:tick .09s linear}
@keyframes tick{from{transform:translateY(-10%);opacity:.5;filter:blur(2px)}}
.revealed .reel .nm{animation:pop .7s cubic-bezier(.2,1.4,.3,1) both;text-shadow:0 0 40px color-mix(in srgb,var(--c) 70%,transparent),0 0 2px #fff;background:linear-gradient(180deg,#fff 30%,color-mix(in srgb,var(--c) 70%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent}
@keyframes pop{0%{transform:translateY(-50%) scale(.6);opacity:0;filter:blur(8px)}100%{transform:translateY(-50%) scale(1);opacity:1;filter:none}}
.desc{position:relative;font-size:19px;color:#cdd5e3;max-width:680px;margin:0 auto;line-height:1.45;min-height:56px;opacity:0;transform:translateY(10px);transition:.5s .25s}
.chips{position:relative;display:flex;justify-content:center;gap:10px;margin-top:26px;opacity:0;transform:translateY(10px);transition:.5s .4s}
.revealed .desc,.revealed .chips,.revealed .actions{opacity:1;transform:none}
.chip{min-width:84px;padding:10px 6px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid var(--line2)}
.chip .k{font-size:11px;letter-spacing:.18em;color:var(--mute)}
.chip .v{font-family:"Bebas";font-size:32px;line-height:1;margin-top:2px}
.chip.total{border-color:color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 10%,rgba(0,0,0,.35))}
.tagc{display:inline-block;margin-left:10px;font-size:10px;letter-spacing:.2em;padding:3px 8px;border-radius:999px;border:1px solid rgba(255,200,90,.5);color:#ffd27a;vertical-align:4px}
.actions{position:relative;display:flex;justify-content:center;gap:12px;margin-top:30px;opacity:0;transform:translateY(10px);transition:.5s .55s}
.btn{padding:14px 28px;border-radius:14px;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase;transition:.2s}
.btn.primary{background:linear-gradient(180deg,#fff,#d9e6f5);color:#071018;box-shadow:0 10px 30px -8px color-mix(in srgb,var(--c) 70%,transparent),inset 0 -2px 0 rgba(0,0,0,.12)}
.btn.primary:hover{transform:translateY(-2px)}
.btn.ghost{border:1px solid var(--line2);color:var(--mute)}
.btn.ghost:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.kbd{font-size:10px;opacity:.55;margin-left:8px;letter-spacing:.1em}
.trio{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:26px auto 0;width:min(1240px,92vw)}
.stage{width:min(1240px,92vw)}
.opt{--c2:var(--c);position:relative;text-align:center;padding:22px 18px 18px;border-radius:20px;background:linear-gradient(170deg,rgba(255,255,255,.06),rgba(0,0,0,.35));border:1px solid var(--line2);min-height:250px;display:flex;flex-direction:column;align-items:stretch;transition:transform .25s,border-color .25s,box-shadow .25s,opacity .35s,filter .35s;backdrop-filter:blur(8px)}
.opt .okey{position:absolute;top:12px;left:14px;width:24px;height:24px;border-radius:7px;border:1px solid var(--line2);font-size:12px;display:grid;place-items:center;color:var(--mute)}
.oreel{height:78px;position:relative;overflow:hidden;margin-top:10px;mask-image:linear-gradient(transparent,#000 25%,#000 75%,transparent)}
.onm{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font-family:"Bebas";font-size:56px;line-height:1;white-space:nowrap;color:#fff;letter-spacing:.03em}
.onm.tick{animation:tick .09s linear}
.opt.landed .onm{animation:pop .6s cubic-bezier(.2,1.4,.3,1) both;background:linear-gradient(180deg,#fff 30%,color-mix(in srgb,var(--c) 70%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--c) 55%,transparent))}
.opt.landed{border-color:color-mix(in srgb,var(--c) 45%,transparent)}
.odesc{font-size:15px;color:#cdd5e3;line-height:1.45;margin-top:10px;flex:1;opacity:0;transform:translateY(6px);transition:.4s .1s}
.opt.landed .odesc{opacity:1;transform:none}
.olock{margin-top:14px;padding:10px;border-radius:12px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--mute);border:1px dashed var(--line2);opacity:0;transition:.3s}
.revealed .opt .olock{opacity:1}
.revealed .opt:hover{transform:translateY(-6px);border-color:var(--c);box-shadow:0 22px 50px -16px color-mix(in srgb,var(--c) 70%,transparent)}
.revealed .opt:hover .olock{background:#fff;color:#071018;border-style:solid;border-color:#fff}
.opt:disabled{cursor:default}
.opt.chosen{transform:translateY(-8px) scale(1.04)!important;border-color:var(--c);box-shadow:0 0 0 2px var(--c),0 30px 70px -18px color-mix(in srgb,var(--c) 80%,transparent)}
.opt.chosen .olock{background:var(--c);color:#071018;border-color:var(--c)}
.opt.passed{opacity:.25;filter:grayscale(1);transform:scale(.96)}
.pickhint{position:relative;margin-top:18px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);opacity:0;transition:.4s}
.revealed .pickhint{opacity:1}
.stage .chips{margin-top:14px}
.resetbar{display:flex;justify-content:center;margin-top:2px}
.resetbar .btn{padding:11px 26px;font-size:13px}
#resetAll.armed{border-color:#ff6b6b;color:#ff6b6b;background:rgba(255,107,107,.08)}
.tier.used{opacity:.38;filter:grayscale(.85)}
.tier.used .left{color:var(--ice)}
canvas#fx{position:fixed;inset:0;z-index:60;pointer-events:none}
/* modal */
.modal{width:min(920px,92vw);max-height:86vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#0e1320,#0a0e18);border:1px solid var(--line2);border-radius:22px;box-shadow:0 40px 120px rgba(0,0,0,.6);overflow:hidden;transform:translateY(16px) scale(.98);transition:.3s}
.overlay.on .modal{transform:none}
.mhead{display:flex;align-items:center;gap:16px;padding:18px 22px;border-bottom:1px solid var(--line)}
.mhead h2{font-family:"Bebas";font-weight:400;font-size:30px;letter-spacing:.05em}
.tabs{display:flex;gap:6px;margin-left:18px}
.tab{padding:8px 14px;border-radius:10px;font-size:13px;color:var(--mute)}
.tab.on{background:var(--panel2);color:#fff}
.mbody{padding:20px 22px;overflow:auto;flex:1}
.mbody::-webkit-scrollbar{width:8px}.mbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;padding:14px 22px;border-top:1px solid var(--line)}
.field{display:grid;grid-template-columns:200px 1fr;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.field label{color:var(--mute);font-size:14px}
.inp{background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:10px;padding:9px 12px;outline:none;width:100%}
.inp:focus{border-color:rgba(159,220,255,.6)}
.inp.sm{width:110px;text-align:right}
.players{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:8px}
.toggle{position:relative;width:46px;height:26px;border-radius:999px;background:rgba(255,255,255,.12);transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--ice)}.toggle.on::after{left:23px}
.costrow{--c:#fff;display:grid;grid-template-columns:14px 1fr 120px 130px;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.hint{font-size:12.5px;color:var(--dim);line-height:1.5;margin-bottom:12px}
.pooltools{display:flex;gap:10px;margin-bottom:14px}
.prowa{--c:#fff;display:grid;grid-template-columns:1fr 170px 76px;gap:12px;align-items:center;padding:9px 10px;border-radius:10px}
.prowa:nth-child(odd){background:rgba(255,255,255,.025)}
.prowa .n{font-weight:600;font-size:14px}.prowa .n i{font-style:normal;color:var(--c);font-size:10px;letter-spacing:.2em;margin-left:8px}
.prowa .dd{font-size:12px;color:var(--mute);margin-top:2px}
.prowa select{background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;color:var(--c)}
.prowa select option{color:#000}
.prowa.banned{opacity:.5}.prowa.banned .n{text-decoration:line-through}
.bantag{font-size:10px;letter-spacing:.2em;color:#ff6b6b;margin-left:8px;font-weight:600;display:inline-block;text-decoration:none}
.banbtn{padding:6px 0;border-radius:8px;border:1px solid var(--line2);font-size:12px;color:var(--mute);transition:.2s}.banbtn:hover{border-color:#ff6b6b;color:#ff6b6b}.banbtn.on{border-color:var(--ice);color:var(--ice)}
.prowa.moved{outline:1px solid rgba(255,210,122,.35)}
/* summary */
.sumgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.sumcard{padding:16px;border-radius:16px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.sumcard h4{font-family:"Bebas";font-size:28px;font-weight:400;letter-spacing:.05em;display:flex;justify-content:space-between}
.sumcard ol{list-style:none;margin-top:8px}
.sumcard li{--c:#fff;display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.sumcard li b{color:var(--c);font-weight:600}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:80;padding:10px 18px;border-radius:12px;background:#121a2a;border:1px solid var(--line2);font-size:14px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

  for(let r=1;r<=S.settings.rounds;r++){
    const p=mine.find(x=>x.round===r);
    if(p){const t=T[p.t];h+=`<div class="entry" style="--c:${t.c}" title="${esc(p.d)}${p.others&&p.others.length?"\n\nAlso rolled: "+esc(p.others.join(", ")):""}"><div class="r">${r}</div><div><div class="a">${esc(p.n)}</div><div class="t">${t.name}</div></div><div class="d ${cls(p.cost)}" style="color:${p.cost>0?"var(--good)":p.cost<0?"var(--cost)":"var(--dim)"}">${fmt(p.cost)}</div></div>`}
    else h+=`<div class="slot"><div class="r">${r}</div><div>${r===turnInfo().round&&v===turnInfo().pi&&!turnInfo().done?"Choose a category to roll…":"—"}</div></div>`;
  }
  $("logList").innerHTML=h;
  const total=ABILITIES.length-S.banned.length, left=S.settings.unique?ABILITIES.filter(a=>!isBanned(a)&&!used().has(a.n)).length:total;
  $("poolLeft").textContent=`${left} / ${total} in pool`;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- audio ---------- */
let AC=null,BUS=null,VERB=null;
function ac(){
  if(AC) return AC;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;comp.attack.value=.004;comp.release.value=.25;
  const master=AC.createGain();master.gain.value=.9;comp.connect(master).connect(AC.destination);
  BUS=AC.createGain();BUS.connect(comp);
  // generated hall reverb
  const len=AC.sampleRate*2.4,ir=AC.createBuffer(2,len,AC.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2)}
  VERB=AC.createConvolver();VERB.buffer=ir;const wet=AC.createGain();wet.gain.value=.32;VERB.connect(wet).connect(comp);
  return AC;
}
function voice({f,type="sine",dur=.6,gain=.08,when=0,attack=.004,detune=0,verb=.5,lp=null,glideTo=null}){
  if(!S.settings.sound) return;
  const a=ac(),t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);o.detune.value=detune;
  if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo,t+dur*.8);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  let n=o.connect(g);
  if(lp){const fl=a.createBiquadFilter();fl.type="lowpass";fl.frequency.value=lp;n=g.connect(fl)}
  n.connect(BUS);if(verb){const s=a.createGain();s.gain.value=verb;n.connect(s).connect(VERB)}
  o.start(t);o.stop(t+dur+.05);
}
function bell(f,when=0,gain=.07,dur=1.6){ // soft glassy bell: fundamental + inharmonic partials
  voice({f,dur,gain,when,attack:.003});
  voice({f:f*2.01,dur:dur*.6,gain:gain*.35,when,attack:.002});
  voice({f:f*3.98,dur:dur*.3,gain:gain*.12,when,attack:.001});
}
function click(when=0,gain=.12,hp=2400){ // short filtered noise transient, like a mechanical reel detent
  if(!S.settings.sound) return;
  const a=ac(),t=a.currentTime+when,b=a.createBuffer(1,a.sampleRate*.03,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,6);
  const src=a.createBufferSource();src.buffer=b;const f=a.createBiquadFilter();f.type="bandpass";f.frequency.value=hp;f.Q.value=1.4;
  const g=a.createGain();g.gain.value=gain;src.connect(f).connect(g).connect(BUS);src.start(t);
}
function tone(f,d=.3,type,g=.06,when=0){bell(f,when,g,d*2)} // legacy helper
function sfxTick(i){click(0,.09,2000+(i%4)*260);voice({f:1800+(i%3)*120,dur:.035,gain:.012,verb:0})}
function sfxLand(i){click(0,.16,1400);bell([659.25,783.99,987.77][i%3],0,.06,1.2)}
function sfxLock(){[1046.5,1318.5,1568,2093].forEach((f,i)=>bell(f,i*.045,.045,1.4));voice({f:130.8,dur:.9,gain:.08,type:"sine",verb:.3})}
function sfxReveal(cost){
  if(cost>0){ // ominous: low detuned pad sliding down, filtered
    [110,164.8,130.8].forEach((f,i)=>{voice({f,type:"sawtooth",dur:1.8,gain:.035,attack:.08,detune:-8,lp:700,glideTo:f*.84,when:i*.05});voice({f,type:"sawtooth",dur:1.8,gain:.035,attack:.08,detune:8,lp:700,glideTo:f*.84,when:i*.05})});
    voice({f:55,dur:1.6,gain:.14,attack:.01,verb:.2,glideTo:41});return;
  }
  if(cost===0){bell(523.25,0,.05,1);bell(659.25,.08,.04,1);return}
  const chord=cost<=-100?[523.25,659.25,783.99,987.77,1318.5]:[440,554.37,659.25,880];
  chord.forEach((f,i)=>{bell(f,i*.06,.055,2.2);voice({f,type:"triangle",dur:2.2,gain:.02,attack:.25,detune:i%2?6:-6,lp:3000,when:i*.06})});
  voice({f:chord[0]/4,dur:1.8,gain:.12,attack:.01,verb:.3});
  if(cost<=-100) for(let k=0;k<10;k++) bell(2093*Math.pow(1.122,k%6),.35+k*.05,.018,.8); // sparkle run
}

/* ---------- rolling ---------- */
let rolling=null;
const usedTier=(pi,tid)=>S.picks.some(p=>p.pi===pi&&p.t===tid);
function draw3(tid){const p=[...pool(tid)],out=[];while(out.length<3&&p.length)out.push(p.splice(rand(p.length),1)[0]);return out}
function startRoll(tid){
  const ti=turnInfo(); if(ti.done||rolling||usedTier(ti.pi,tid)) return;
  const opts=draw3(tid); if(!opts.length) return;
  const t=T[tid], cost=S.costs[tid];
  rolling={opts,t:tid,cost,ready:false,timers:[]};
  const st=$("stage");st.style.setProperty("--c",t.c);st.classList.remove("revealed");
  $("rollWho").textContent=`Round ${ti.round} of ${S.settings.rounds}`;
  $("rollPill").innerHTML=`<svg viewBox="0 0 24 24" width="16" height="16" style="stroke:${t.c};fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">${t.icon}</svg>${t.name} · 3 rolls`;
  const ps=perStat(cost);
  $("rollChips").innerHTML=STATS.map(k=>`<div class="chip"><div class="k">${k}</div><div class="v ${cls(ps)}">${fmt(ps)}</div></div>`).join("")+
    `<div class="chip total"><div class="k">BST</div><div class="v ${cls(cost)}">${fmt(cost)}</div></div>`;
  $("trio").innerHTML=opts.map((a,i)=>`<button class="opt" data-i="${i}" disabled><div class="okey">${i+1}</div><div class="oreel"><div class="onm">—</div></div><div class="odesc"></div><div class="olock">Keep this one</div></button>`).join("");
  $("trio").querySelectorAll(".opt").forEach(b=>b.onclick=()=>lockIn(+b.dataset.i));
  $("rollOv").classList.add("on");
  const names=ABILITIES.filter(a=>tierOf(a)===tid&&!isBanned(a)).map(a=>a.n);
  opts.forEach((a,i)=>{
    const card=$("trio").children[i], nm=card.querySelector(".onm"), N=26+i*9; let k=0;
    const step=()=>{
      if(!rolling) return;
      if(k>=N){land(i);return}
      nm.textContent=names[rand(names.length)];
      nm.classList.remove("tick");void nm.offsetWidth;nm.classList.add("tick");
      if(i===opts.length-1||k%2===0) sfxTick(k);
      const p=k/N; k++;
      rolling.timers.push(setTimeout(step,35+Math.pow(p,3.2)*380));
    };
    step();
  });
}
function land(i){
  const r=rolling, a=r.opts[i], card=$("trio").children[i], nm=card.querySelector(".onm");
  nm.classList.remove("tick");nm.textContent=a.n;
  card.querySelector(".odesc").innerHTML=esc(a.d);
  card.classList.add("landed");fitOne(nm,card);
  sfxLand(i);
  if(card.parentNode.querySelectorAll(".landed").length===r.opts.length){
    $("stage").classList.add("revealed");r.ready=true;
    card.parentNode.querySelectorAll(".opt").forEach(b=>b.disabled=false);
    sfxReveal(r.cost);
    burst(T[r.t].c, r.t==="elite"?220:r.t==="awful"?160:110, r.t==="awful");
  }
}
function fitOne(nm,card){let s=56;nm.style.fontSize=s+"px";const max=card.clientWidth-36;while(nm.scrollWidth>max&&s>26){s-=2;nm.style.fontSize=s+"px"}}
function lockIn(i){
  if(!rolling||!rolling.ready||!rolling.opts[i]) return;
  const ti=turnInfo(), r=rolling, a=r.opts[i];
  S.picks.push({n:a.n,d:a.d,t:r.t,cost:r.cost,round:ti.round,pi:ti.pi,others:r.opts.filter((_,j)=>j!==i).map(x=>x.n)});
  const card=$("trio").children[i];card.classList.add("chosen");
  [...$("trio").children].forEach((c,j)=>{if(j!==i)c.classList.add("passed")});
  rolling.ready=false;sfxLock();
  setTimeout(()=>{closeRoll();save();render();if(turnInfo().done) setTimeout(showSummary,500)},650);
}
function closeRoll(){if(rolling)rolling.timers.forEach(clearTimeout);rolling=null;$("rollOv").classList.remove("on")}
$("discardBtn").onclick=()=>{closeRoll();toast("Roll discarded")};

/* ---------- particles ---------- */
const cv=$("fx"),cx=cv.getContext("2d");let parts=[];
function sizeCv(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener("resize",sizeCv);sizeCv();
function burst(color,n,smoke){
  const W=innerWidth/2,H=innerHeight*.42;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=smoke?1+Math.random()*4:3+Math.random()*11;
    parts.push({x:W,y:H,vx:Math.cos(a)*s,vy:Math.sin(a)*s-(smoke?1:2),life:1,dec:.006+Math.random()*.012,r:smoke?3+Math.random()*7:1.5+Math.random()*3.2,c:Math.random()<.25?"#ffffff":color,sq:!smoke&&Math.random()<.5,rot:Math.random()*6})}
  if(!anim)loop();
}
let anim=false;
function loop(){anim=true;const d=devicePixelRatio;cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vx*=.975;p.vy=p.vy*.975+.09;p.life-=p.dec;p.rot+=.1;
    cx.globalAlpha=Math.max(p.life,0);cx.fillStyle=p.c;cx.save();cx.translate(p.x*d,p.y*d);cx.rotate(p.rot);
    if(p.sq)cx.fillRect(-p.r*d,-p.r*d*.5,p.r*2*d,p.r*d);else{cx.beginPath();cx.arc(0,0,p.r*d,0,7);cx.fill()}cx.restore()}
  if(parts.length)requestAnimationFrame(loop);else{anim=false;cx.clearRect(0,0,cv.width,cv.height)}}

/* ---------- settings ---------- */
let tab="run";
function openSettings(){$("setOv").classList.add("on");renderSettings()}
function closeSettings(){$("setOv").classList.remove("on");save();render()}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));renderSettings()});
function renderSettings(){
  const B=$("setBody"), st=S.settings;
  const moved=Object.keys(S.overrides).length;
  $("poolCount").textContent=`${ABILITIES.length-S.banned.length} abilities in play · ${S.banned.length} banned · ${moved} re-tiered`;
  if(tab==="run"){
    B.innerHTML=`
    <div class="field"><label>No repeat abilities</label><div><button class="toggle ${st.unique?"on":""}" id="fUnique"></button></div></div>
    <div class="field"><label>Sound effects</label><div><button class="toggle ${st.sound?"on":""}" id="fSound"></button></div></div>
    <p class="hint" style="margin-top:14px">Shortcuts: <b>1 / 2 / 3</b> keep that ability · <b>Esc</b> discard · <b>Ctrl+Z</b> undo last pick · <b>F11</b> fullscreen. Each category button can be used once per run. Use <b>Reset all choices</b> to start over.</p>`;
    B.querySelectorAll("[data-rm-x]").forEach(b=>b.onclick=()=>{if(S.picks.length&&!confirmish("Removing a player starts a new run."))return;st.players.splice(+b.dataset.rm,1);S.picks=[];renderSettings()});
    const ap=null;if(ap)ap.onclick=()=>{if(S.picks.length&&!confirmish("Adding a player starts a new run."))return;st.players.push(`Player ${st.players.length+1}`);S.picks=[];renderSettings()};
    $("fUnique").onclick=()=>{st.unique=!st.unique;renderSettings()};
    $("fSound").onclick=()=>{st.sound=!st.sound;renderSettings()};
  } else if(tab==="costs"){
    B.innerHTML=`<p class="hint">Total base stat change for each category. It is split evenly across all six stats (always rounded to a multiple of 6). Negative = the player pays; positive = the player gets a bonus.</p>`+
      TIERS.map(t=>`<div class="costrow" style="--c:${t.c}"><div class="dot"></div><div><b>${t.name}</b> <span class="hint">· ${ABILITIES.filter(a=>tierOf(a)===t.id&&!isBanned(a)).length} abilities</span></div><input class="inp sm" type="number" step="6" data-cost="${t.id}" value="${S.costs[t.id]}"><div class="hint" style="margin:0">${fmt(perStat(S.costs[t.id]))} each stat</div></div>`).join("")+
      `<div style="margin-top:16px"><button class="btn ghost" id="rcost">Reset to defaults</button></div>`;
    B.querySelectorAll("[data-cost]").forEach(i=>i.onchange=e=>{S.costs[i.dataset.cost]=Math.round((+e.target.value||0)/6)*6;renderSettings()});
    $("rcost").onclick=()=>{S.costs={...DEFAULT_COSTS};renderSettings()};
  } else {
    B.innerHTML=`<p class="hint">Every ability usable in Scarlet/Violet or Pokémon Champions. Disagree with a placement? Move it to another category, or <b>Ban</b> it to keep it out of every roll. Changes save automatically.</p>
    <div class="pooltools"><input class="inp" id="q" placeholder="Search abilities…"><select class="inp" id="qt" style="width:220px"><option value="">All categories</option><option value="__banned">Banned only</option>${TIERS.map(t=>`<option value="${t.id}">${t.name}</option>`).join("")}</select><button class="btn ghost" id="rpool" style="white-space:nowrap">Reset all</button></div>
    <div id="plist"></div>`;
    const draw=()=>{const q=$("q").value.toLowerCase(),qt=$("qt").value;
      $("plist").innerHTML=ABILITIES.filter(a=>(!q||a.n.toLowerCase().includes(q)||a.d.toLowerCase().includes(q))&&(!qt||(qt==="__banned"?isBanned(a):tierOf(a)===qt))).map(a=>{const t=T[tierOf(a)],bn=isBanned(a);
        return `<div class="prowa ${S.overrides[a.n]?"moved":""} ${bn?"banned":""}" style="--c:${t.c}"><div><div class="n">${esc(a.n)}${bn?"<b class=bantag>BANNED</b>":""}</div><div class="dd">${esc(a.d)}</div></div><select data-a="${esc(a.n)}" ${bn?"disabled":""}>${TIERS.map(x=>`<option value="${x.id}" ${x.id===t.id?"selected":""}>${x.name}</option>`).join("")}</select><button class="banbtn ${bn?"on":""}" data-ban="${esc(a.n)}">${bn?"Unban":"Ban"}</button></div>`}).join("");
      $("plist").querySelectorAll("[data-ban]").forEach(b=>b.onclick=()=>{const n=b.dataset.ban;S.banned=S.banned.includes(n)?S.banned.filter(x=>x!==n):[...S.banned,n];draw();renderSettings.count()});
      $("plist").querySelectorAll("select").forEach(s=>s.onchange=()=>{const a=ABILITIES.find(x=>x.n===s.dataset.a);if(s.value===a.t)delete S.overrides[a.n];else S.overrides[a.n]=s.value;draw();renderSettings.count()})};
    $("q").oninput=draw;$("qt").onchange=draw;$("rpool").onclick=()=>{S.overrides={};draw()};draw();
  }
}
renderSettings.count=()=>{$("poolCount").textContent=`${ABILITIES.length-S.banned.length} abilities in play · ${S.banned.length} banned · ${Object.keys(S.overrides).length} re-tiered`};
function confirmish(msg){return window.confirm(msg)}
$("setBtn").onclick=openSettings;$("closeSetBtn").onclick=closeSettings;
$("resetRunBtn").onclick=()=>{if(S.picks.length&&!confirmish("Start a new run? Current picks will be cleared."))return;S.picks=[];closeSettings();toast("New run started")};

/* ---------- summary ---------- */
function showSummary(){
  const P=S.settings.players;
  $("sumGrid").innerHTML=P.map((n,i)=>{const m=S.picks.filter(p=>p.pi===i);const tot=m.reduce((s,p)=>s+p.cost,0);
    return `<div class="sumcard"><h4>Your abilities<span style="color:${tot>0?"var(--good)":tot<0?"var(--cost)":"var(--mute)"}">${fmt(tot)} BST</span></h4>
    <div class="hint" style="margin:4px 0 0">${fmt(perStat(tot))} to every stat</div><ol>${m.map(p=>`<li style="--c:${T[p.t].c}"><span>R${p.round} · <b>${esc(p.n)}</b></span><span>${fmt(p.cost)}</span></li>`).join("")}</ol></div>`}).join("");
  $("sumOv").classList.add("on");
  burst("#9fdcff",200,false);
}
$("sumCloseBtn").onclick=()=>$("sumOv").classList.remove("on");
$("sumNewBtn").onclick=()=>{S.picks=[];save();$("sumOv").classList.remove("on");render();toast("New run started")};

/* ---------- reset ---------- */
let armT;
$("resetAll").onclick=()=>{const b=$("resetAll");
  if(!S.picks.length){toast("Nothing to reset");return}
  if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Click again to reset";clearTimeout(armT);armT=setTimeout(()=>{b.classList.remove("armed");b.textContent="Reset all choices"},3000);return}
  clearTimeout(armT);b.classList.remove("armed");b.textContent="Reset all choices";
  S.picks=[];save();$("sumOv").classList.remove("on");render();toast("All choices reset");burst("#9fdcff",80,false)};
/* ---------- misc ---------- */
function undo(){if(rolling)return;const p=S.picks.pop();if(p){save();render();toast(`Undid ${p.n}`)}}
$("undoBtn").onclick=undo;
let tt;function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}
addEventListener("keydown",e=>{
  if($("setOv").classList.contains("on")){if(e.key==="Escape")closeSettings();return}
  if($("rollOv").classList.contains("on")){if(["1","2","3"].includes(e.key)){e.preventDefault();lockIn(+e.key-1)}else if(e.key==="Escape"){closeRoll();toast("Roll discarded")}return}
  if($("sumOv").classList.contains("on")){if(e.key==="Escape")$("sumOv").classList.remove("on");return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();undo()}
});
render();
if(turnInfo().done) showSummary();
</script>
</body>
